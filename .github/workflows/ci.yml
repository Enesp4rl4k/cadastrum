name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

# Aynı branch için eski run'ı iptal et (duplicate run tasarrufu)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: Extension Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Extension typecheck
        run: npm run lint

      # Sprint B.1 — sessiz hata yasağı. Boş/yorum-only catch bloğu sayısı
      # dosya bazında dondurulmuş baseline'ı AŞAMAZ. Ayrıntı: scripts/catch-disiplini.mjs
      - name: catch disiplini (sessiz hata yasağı)
        run: npm run lint:catch

      - name: Extension tests
        run: npm test

      # Vekil (proxy) backtest guard'i 2026-08-31'de emekliye ayrildi:
      # ilce-ortalamasi taklidi olcuyordu, motorun kendisini degil. Iki ayri
      # "dogruluk" sayisi ayni anda yasarken hangisinin bozuldugu belirsizdi.
      # Tek olcu: asagidaki gercek motor backtest'i (fiyatTahminEt).
      - name: Accuracy regression guard (real engine)
        run: npm run backtest:real

      - name: Extension build (store)
        run: npm run build:store

  backend-api:
    name: Backend API Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/api/package-lock.json

      - name: Install backend deps
        run: npm ci

      - name: Backend typecheck
        run: npx tsc --noEmit

      - name: Backend tests
        run: npm test

  site:
    name: Site Build & Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site deps
        run: npm ci

      - name: Site check
        run: npm run check

      # Üretilmiş site verileri kaynaklarıyla güncel mi?
      # Bayatlarsa yeni ilçelerin sayfası sessizce üretilmez, otoyol katmanı
      # sessizce boş kalır. İkisi de "hata yok ama içerik yok" sınıfı.
      - name: Üretilmiş veri güncel mi
        working-directory: .
        run: |
          node scripts/site-ilce-listesi-uret.mjs
          node scripts/site-otoyol-geojson-uret.mjs
          git diff --exit-code site/src/data/ilceler.ts site/public/geo/otoyollar.geojson

      - name: Site build
        run: npm run build

      # Build'den SONRA: rota sözleşmesi testleri dist'e de bakıyor —
      # sitemap'in bildirdiği her URL için gerçek bir sayfa üretilmiş mi.
      - name: Site tests
        run: npm test
