apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadastrum-api
  namespace: cadastrum
  labels:
    app: cadastrum-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cadastrum-api
  template:
    metadata:
      labels:
        app: cadastrum-api
    spec:
      containers:
        - name: api
          image: cadastrum-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8787
          envFrom:
            - configMapRef:
                name: cadastrum-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1.5Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8787
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8787
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: cadastrum-api-service
  namespace: cadastrum
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8787
      protocol: TCP
      name: http
  selector:
    app: cadastrum-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cadastrum-api-hpa
  namespace: cadastrum
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cadastrum-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75